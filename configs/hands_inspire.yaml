# Inspire hand OPEN/CLOSE presets.
#
# Command interface = the one the simulator subscribes to (dds/inspire_dds.py), identical to the
# xr_teleoperate "inspire_dfx" interface: topic rt/inspire/cmd, unitree_go MotorCmds_ with 12 cmds,
# field q normalised to [0, 1] where 1.0 = open (extended) and 0.0 = closed (flexed).
# The FTP interface (rt/inspire_hand/ctrl/{l,r}, 0..1000) is NOT what the simulator listens to.
#
# Channel order (index -> joint driven in the USD; ranges from the official sim/teleop code):
#   R: 0 pinky, 1 ring, 2 middle, 3 index, 4 thumb bend (pitch), 5 thumb rotation (yaw)
#   L: 6 pinky, 7 ring, 8 middle, 9 index, 10 thumb bend, 11 thumb rotation
#   finger proximal  angle = (1 - q) * 1.7             [0, 1.7] rad
#   thumb pitch      angle = (1 - q) * 0.5             [0, 0.5] rad
#   thumb yaw        angle = (1 - q) * 1.4 - 0.1       [-0.1, 1.3] rad
#   coupled joints (kept, driven by the sim): finger intermediate = 1.0 x proximal,
#   thumb intermediate = 1.5 x thumb pitch, thumb distal = 2.4 x thumb pitch.
#
# User-level command is binary (OPEN / CLOSE). The per-channel targets below are what OPEN and CLOSE
# expand to; the hub ramps between them at hands.max_rate_per_s.

per_hand_channels: [pinky, ring, middle, index, thumb_bend, thumb_rot]

presets:
  # Thumb is pre-rotated into opposition in BOTH states (thumb_rot 0.15 => ~1.09 rad) so that
  # OPEN->CLOSE only flexes the digits and the thumb does not sweep through the object.
  open:
    pinky: 1.0
    ring: 1.0
    middle: 1.0
    index: 1.0
    thumb_bend: 1.0
    thumb_rot: 0.15
  # "wrap" close for a ~60 mm cylinder: digits to ~1.45 rad (not a full 1.7 rad fist), thumb pitch
  # ~0.40 rad. Position targets past the contact point give the squeeze force.
  close:
    pinky: 0.15
    ring: 0.15
    middle: 0.15
    index: 0.15
    thumb_bend: 0.20
    thumb_rot: 0.15
  # alternatives (select with active_close / active_open)
  open_flat:
    {pinky: 1.0, ring: 1.0, middle: 1.0, index: 1.0, thumb_bend: 1.0, thumb_rot: 1.0}
  fist:
    {pinky: 0.0, ring: 0.0, middle: 0.0, index: 0.0, thumb_bend: 0.0, thumb_rot: 0.0}

active_open: open
active_close: close

# Per simulated hand model (simulator status "hand_model", configs/scene_desk.yaml robot.hand_model): the hub switches
# to these presets when it sees the model. Keys override the ones above.
hand_models:
  rh56e2:
    # Inspire RH56E2 (docs/HAND_RH56E2.md): q maps to the E2 ranges (fingers 0..1.4381, thumb bend 0..0.62,
    # thumb rotation 0..1.658 rad). Hand-vs-cylinder check (tools: docs/HAND_RH56E2.md section 6): with the thumb
    # pre-rotated to q 0.45 (0.91 rad) and closing to fingers 0.15 / thumb bend 0.65, a 60 mm cylinder at
    # (0.170, 0.060) in the IK end-effector frame is cleared by the open hand (16 mm) and held with fingers 10 mm
    # and thumb 6.5 mm past contact, contact directions 119 deg apart.
    presets:
      open:  {pinky: 1.0, ring: 1.0, middle: 1.0, index: 1.0, thumb_bend: 1.0, thumb_rot: 0.45}
      close: {pinky: 0.15, ring: 0.15, middle: 0.15, index: 0.15, thumb_bend: 0.65, thumb_rot: 0.45}

