# Long-walk variant of scripted_walk_grasp_desk065.yaml for ACT training data (2026-11-19, user request: "walk from
# far away and grasp"). Same grasp geometry and walking law; differences, all aimed at a policy that must decide
# walk / stop / reach from its cameras:
#   - started 1.1-1.8 m behind the stand pose by tools/batch_walk_grasp.py (--robot-x -1.0 -0.4 --robot-y -0.3 0.3)
#     instead of 0.6-0.9 m, so walking is a large share of every episode
#   - grasp_wait_s 0.2 / engage_s 0.3 (was 1.0 / 0.5): fewer standing-still frames between arriving and reaching
#     (the old data had ~75 standing frames vs ~60 walking frames before the arm moved -> the ACT walking output
#     collapsed to its median 0, docs/ACT_EVAL.md)
#   - walking timeout 60 s (longer walk); stand tolerance along 4 cm / cross 3 cm (was 2.5 / 2.5)
side: right
desk_top_z: 0.65
object_half_height: 0.06
grasp_rpy_deg: [0.0, 15.0, 0.0]
offsets_frame: hand
grasp_point_dz: 0.0
raise_dx: -0.04
raise_z: 0.06
pregrasp_offset: [-0.170, -0.130, 0.005]
grasp_offset: [-0.170, -0.060, 0.005]
lift_height: 0.10
t_raise: 3.0
t_pregrasp: 3.0
t_approach: 2.0
t_close: 1.2
t_lift: 2.0
t_hold: 2.0
success_lift_m: 0.05
grasp_wait_s: 0.2
engage_s: 0.3
servo_approach: true
servo_gain: 2.0
servo_limit_m: 0.04
servo_tol_m: 0.005
servo_settle_max_s: 2.0

walk:
  stand_rel: [0.31, -0.10]          # object in the robot frame (IK miss smallest at 0.30-0.33)
  goal_yaw_deg: 0.0                 # world yaw to face at the stand pose (0 = square to the desk front)
  start_delay_s: 1.0                # stand still first (recording starts here)
  vx_walk: 0.5                      # forward command while walking (|vx| < ~0.3 does not step)
  lateral_mode: holonomic           # holonomic: keep facing goal_yaw, sideways component removes the cross error
                                    # (in-place turns are unreliable, so do not let the heading wander); stanley: steer
  k_lat: 3.0                        # holonomic: vy = -k_lat * cross error (1/s)
  vy_walk_max: 0.5
  wz_walk_max: 0.8                  # yaw-rate command limit while walking (steering works while stepping)
  k_cross: 2.5                      # stanley only, 1/m
  k_yaw: 2.0                        # 1/s
  ramp_s: 0.3
  stop_dist_m: 0.10                 # stop commanding this far before the stand pose (policy coasts ~0.09 m)
  settle_s: 1.0
  tol_along_m: 0.04                 # robot-frame object position vs stand_rel (0.025 in desk065: half of the
                                    # long-walk stops coasted 2.5-6 cm off and re-approached with an 8-9 deg lurch)
  tol_cross_m: 0.03 
  tol_yaw_deg: 12.0
  max_corrections: 3
  correction: reapproach            # reapproach: back off backoff_s at -vx_back, then walk in again (short
                                    # single-axis pulses do not make the policy step: it sways and returns);
                                    # pulse: single-axis pulses (kept for experiments)
  backoff_s: 1.0
  pre_walk_s: 0.6
  timeout_s: 60.0                   # sim seconds for the whole walking part
  pulse:                            # corrective pulses (measured responses, see sources.py _plan_pulse)
    vx_fwd: 0.5
    fwd_speed: 0.23
    fwd_coast_m: 0.09
    vx_back: 0.6
    back_speed: 0.2
    back_coast_m: 0.05
    vy: 0.5
    lat_speed: 0.13
    lat_coast_m: 0.05
    wz: 1.57
    yaw_rate: 0.2                   # rad/s actually reached (measured: 0.8 s at 1.57 -> ~11 deg, sometimes no step)
    yaw_min_s: 0.8

hand_models: {}
